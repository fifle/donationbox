# Rate-limit and connection-limit by real client IP from Fly proxy.
# Loaded into http{} via /etc/nginx/conf.d/

map $http_fly_client_ip $db_limit_key {
    default $http_fly_client_ip;
    ""      $binary_remote_addr;
}

limit_req_zone  $db_limit_key zone=db_perip:10m rate=20r/s;
limit_conn_zone $db_limit_key zone=db_perip_conn:10m;
